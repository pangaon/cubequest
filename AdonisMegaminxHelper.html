<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CubeQuest — by Adoni</title>
<style>
  :root{
    --bg:#0f1226; --bg2:#171a35; --panel:#1d2147; --panel2:#262b5c;
    --ink:#eef1ff; --muted:#a9b0e0; --line:#343a73;
    --accent:#6ee7ff; --accent2:#a78bfa; --good:#39d98a; --warn:#ffcf5c; --bad:#ff6b81;
    --grey:#8b93b8; /* unoriented facelet */
    --radius:18px; --shadow:0 14px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 70% -10%,#23286a 0%,var(--bg) 55%) fixed;
    color:var(--ink); min-height:100vh; line-height:1.5;
  }
  a{color:var(--accent)}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 18px 80px}
  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .badge{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
  .logo h1{font-size:20px;margin:0;letter-spacing:.3px}
  .logo p{margin:0;font-size:12.5px;color:var(--muted)}
  .pill{margin-left:auto;font-size:12px;background:#3a1d2e;color:#ffd7df;border:1px solid #6b2740;
    padding:7px 12px;border-radius:999px;font-weight:600}
  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  nav.tabs button{background:var(--panel);color:var(--muted);border:1px solid var(--line);
    padding:9px 14px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s}
  nav.tabs button:hover{color:var(--ink);border-color:var(--accent)}
  nav.tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0c1030;border-color:transparent}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:.1em 0 .5em;font-size:19px}
  .card h3{margin:1em 0 .4em;font-size:15px;color:var(--accent)}
  .muted{color:var(--muted)}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:760px){.g3,.g2{grid-template-columns:1fr}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    padding:12px 18px;border-radius:13px;font-weight:700;font-size:14px;transition:.15s;color:#0c1030;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(110,231,255,.18)}
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.good{background:linear-gradient(135deg,#39d98a,#27b06b)}
  .btn.warn{background:linear-gradient(135deg,#ffcf5c,#ffb02e)}
  .btn.bad{background:linear-gradient(135deg,#ff8aa0,#ff5d77);color:#fff}
  .btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
  .home-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
  @media(max-width:760px){.home-hero{grid-template-columns:1fr}}
  .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
  @media(max-width:760px){.big3{grid-template-columns:1fr}}
  .big3 button{padding:22px 16px;border-radius:16px;font-size:16px;text-align:left;line-height:1.25}
  .big3 button small{display:block;font-weight:600;opacity:.8;font-size:12px;margin-top:4px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .legend .chip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
    padding:5px 10px;border-radius:999px;font-size:12px}
  .legend .sw{width:15px;height:15px;border-radius:5px;border:1px solid rgba(0,0,0,.35)}
  .stage{display:flex;justify-content:center;align-items:center;padding:6px}
  .facelet{cursor:default;transition:fill .25s ease, stroke .2s}
  .facelet.clickable{cursor:pointer}
  .facelet.clickable:hover{stroke:#fff;stroke-width:2.4}
  .turnhint{font-weight:800;font-size:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.between{justify-content:space-between}
  .alg{font-family:"Cascadia Code",Consolas,monospace;font-size:17px;background:#0c0f24;border:1px solid var(--line);
    padding:12px 14px;border-radius:12px;letter-spacing:.5px;color:#d7e7ff;word-spacing:3px}
  .src{font-size:12px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .tag.verified{background:#10331f;color:#7df0b0;border-color:#1f6b3f}
  .tag.beginner{background:#10243f;color:#9cc7ff;border-color:#244a78}
  .tag.adv{background:#2a1a3f;color:#caa6ff;border-color:#4a2f78}
  .coach{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#142a4d,#1a1f47);
    border:1px solid #2a5a8a;border-radius:14px;padding:14px;margin-top:6px}
  .coach .face{font-size:30px;line-height:1}
  .coach .bubble{font-size:14.5px}
  .coach .bubble b{color:var(--accent)}
  .movechips{display:flex;gap:6px;flex-wrap:wrap}
  .movechip{font-family:Consolas,monospace;font-weight:700;font-size:14px;padding:7px 11px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);transition:.15s}
  .movechip.done{color:var(--good);border-color:#1f6b3f}
  .movechip.current{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0c1030;border-color:transparent;transform:scale(1.08)}
  .caselist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .casecard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;transition:.15s;text-align:center}
  .casecard:hover{border-color:var(--accent);transform:translateY(-2px)}
  .casecard .nm{font-size:12.5px;font-weight:700;margin-top:6px}
  .casecard .al{font-size:10.5px;color:var(--muted);font-family:monospace;margin-top:2px;word-break:break-word}
  .progressbar{height:9px;background:#0c0f24;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .progressbar > div{height:100%;background:linear-gradient(90deg,var(--good),var(--accent));width:0}
  table.algtbl{width:100%;border-collapse:collapse;font-size:13px}
  table.algtbl th,table.algtbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.algtbl th{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  table.algtbl td.mono{font-family:monospace;color:#d7e7ff}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#0c0f24;border:1px solid var(--accent);color:var(--ink);padding:12px 18px;border-radius:12px;
    box-shadow:var(--shadow);transition:.3s;z-index:50;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .testrow{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
  .ok{color:var(--good);font-weight:700}.fail{color:var(--bad);font-weight:700}
  .star{color:var(--warn)}
  details summary{cursor:pointer;font-weight:600;color:var(--accent)}
  .kbd{font-family:monospace;background:#0c0f24;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12px}
  .notebtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
  .hidden{display:none}
  @media print{
    body{background:#fff;color:#000}
    nav.tabs,header.top .pill,.noprint{display:none !important}
    .card{box-shadow:none;border:1px solid #bbb;background:#fff;break-inside:avoid}
    .alg{background:#f3f3f3;color:#000;border:1px solid #bbb}
    a{color:#000}
  }
  /* ===== Mobile-friendly (phones & small tablets) ===== */
  html,body{max-width:100%;overflow-x:hidden}
  img,canvas,svg,video{max-width:100%;height:auto}
  /* puzzle picker: never overflow — adapts 1→2→3 columns by width */
  .picker{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  /* notch / home-bar safe areas for installed (home-screen) app */
  body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .wrap{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(80px,env(safe-area-inset-bottom))}
  @media(max-width:620px){
    .wrap{padding-left:12px;padding-right:12px}
    .logo h1{font-size:18px} .logo p{font-size:11.5px}
    .logo .badge{width:40px;height:40px;font-size:20px}
    header.top .pill{display:none}                 /* reclaim space on phones */
    /* tabs become a single swipeable row instead of 5 stacked rows */
    nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      gap:6px;margin:0 -12px 12px;padding:2px 12px 8px;scrollbar-width:none}
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{flex:0 0 auto;padding:9px 12px;font-size:13px}
    .card{padding:15px 14px;border-radius:14px;margin-bottom:12px}
    .card h2{font-size:18px} .card h3{font-size:14px}
    .btn{padding:13px 14px;font-size:14px}
    .big3 button{padding:16px 14px;font-size:15px}
    .picker{grid-template-columns:repeat(2,1fr);gap:10px}
    .picker .btn{flex-direction:column;align-items:flex-start;gap:2px;padding:14px 12px}
    .picker .btn small{font-size:11px;opacity:.85}
    .legend{gap:8px}
  }
  @media(max-width:380px){ .picker{grid-template-columns:1fr} }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<div class="wrap">
  <header class="top">
    <div class="logo">
      <div class="badge">🧩</div>
      <div>
        <h1>CubeQuest</h1>
        <p>by Adoni · a patient, honest coach for twisty puzzles</p>
      </div>
    </div>
    <div class="pill">Verified algorithms · real 3D · never guesses</div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Adoni's Megaminx Helper  —  single-file app
   ---------------------------------------------------------------------
   HONESTY / SOURCES
   - All algorithms are transcribed verbatim from named references:
       * Beginner method: Speedsolving.com Wiki "Megaminx LL"
       * 4-Look Last Layer: CubeSkills "Intermediate Megaminx Techniques"
         (Feliks Zemdegs & Andy Klise) + SpeedCubeDB Megaminx EO/CO/EP/CP
   - Each last-layer ORIENTATION case stores the exact top-face sticker
     pattern published by SpeedCubeDB. Diagrams are drawn from that data,
     so the picture and the algorithm can never disagree.
   - Recognition NEVER guesses. If the entered/scanned state does not match
     exactly one verified case, the app says so and asks for more info.
   ===================================================================== */

/* ---------- Colour scheme (editable in Colour Setup) ---------- */
const DEFAULT_COLORS = {
  top:   "#ffd21f", // last-layer (top) colour
  grey:  "#8b93b8", // a facelet that is NOT the top colour (not oriented)
  sides: ["#e23b3b","#2f6bff","#27ae60","#9b59b6","#ff8c1a"] // 5 neighbour faces (red, blue, green, purple, orange)
};
const SIDE_NAMES = ["Red","Blue","Green","Purple","Orange"];
let COLORS = JSON.parse(JSON.stringify(DEFAULT_COLORS));

/* ---------- Top-face pattern decode -----------------------------------
   SpeedCubeDB encodes the top face as 11 chars:
     index 0      = centre
     odd 1,3,5,7,9= the 5 CORNERS (clockwise)
     even 2,4,6,8,10 = the 5 EDGES
   'y' = the top colour faces UP (oriented).  'l' = it does not (not oriented).
   We store, per case: corners[5] and edges[5]  (true = oriented).
--------------------------------------------------------------------- */
function decodeTop(s){
  const corners=[], edges=[];
  for(let k=0;k<5;k++){ corners.push(s[1+2*k]==='y'); edges.push(s[2+2*k]==='y'); }
  return {corners,edges};
}

/* ---------- VERIFIED CASE DATA ---------- */
/* Edge Orientation (3) */
const EO = [
  {id:"EO1",name:"Two edges flipped — far apart",top:"ylllylllyly",alg:"F R U R' U' F'",
   src:"Speedsolving Wiki / SpeedCubeDB EO1",
   kid:"Two yellow edges are pointing out, with one good edge between them. Hold the two bad edges at front and back-right.",
   mistake:"Doing the 'together' algorithm by mistake. Check: is there a good edge BETWEEN the two bad ones? Then it's this one."},
  {id:"EO2",name:"Two edges flipped — next to each other",top:"ylylllllyly",alg:"F U R U' R' F'",
   src:"Speedsolving Wiki / SpeedCubeDB EO2",
   kid:"Two yellow edges next to each other are pointing out. Hold them at the front and the right.",
   mistake:"Make sure the two bad edges really touch. If a good edge sits between them, use the 'far apart' case."},
  {id:"EO3",name:"Four edges flipped (only one good)",top:"ylllllllyll",alg:"F R U2 R2' F R F' U2' F'",
   src:"CubeSkills 4LLL / SpeedCubeDB EO3",
   kid:"Only ONE yellow edge is good; the other four point out. Put the one good edge at the back-left.",
   mistake:"You can also just solve two edges first with an easier case, then the last two — both ways are fine."}
];
/* Corner Orientation (16) — top patterns + primary algorithms (verbatim) */
const CO = [
  {id:"CO1",top:"yyyyylylyyy",alg:"R U R' U R U R' U2' R U' R'"},
  {id:"CO2",top:"ylyyyyyyyly",alg:"F R U2 R' U' R U' R' F'"},
  {id:"CO3",top:"yyylyyyyyly",alg:"R U2 R' U R U2 R'"},
  {id:"CO4",top:"ylyyylyyyyy",alg:"R U R' U' R' F R U R U' R' F'"},
  {id:"CO5",top:"ylylylyyyyy",alg:"R U R' U R U2' R'",name:"Sune"},
  {id:"CO6",top:"yyylylylyyy",alg:"R' U' R U' R' U2 R",name:"Anti-Sune"},
  {id:"CO7",top:"ylyyylyyyly",alg:"R U2 R' U' R U' R'"},
  {id:"CO8",top:"ylyyylyyyly",alg:"R U R' U2 R U2 R'"},
  {id:"CO9",top:"ylylylyyyly",alg:"R U2 R' U' R U R' U' R U' R'"},
  {id:"CO10",top:"ylylylyyyly",alg:"R U R' U R U' R' U R U2' R'"},
  {id:"CO11",top:"ylylylylyyy",alg:"R U R' U R U R' U' R U2' R'"},
  {id:"CO12",top:"ylyyylylyly",alg:"R U2 R' U' R U' R2' U' R U' R' U2 R"},
  {id:"CO13",top:"ylylylyyyly",alg:"R U2 R2' U' R2 U' R2' U2 R"},
  {id:"CO14",top:"yyylylylyly",alg:"R' U2' R2 U R2' U R2 U2' R'"},
  {id:"CO15",top:"ylylylylyly",alg:"R U R' U2 R U2' R' U R U2' R'"},
  {id:"CO16",top:"ylylylylyly",alg:"R U2 R' U' R U2 R' U2' R U' R'"}
];
CO.forEach(c=>{ if(!c.name) c.name="Corner case "+c.id.slice(2);
  c.src="CubeSkills 4LLL / SpeedCubeDB "+c.id;
  c.kid="Look at the yellow corners. Grey corner-tops are not done yet — yellow on a side shows which way they are twisted.";
  c.mistake="Some corner cases look the same on top but twist the other way. Check which side the yellow points to before choosing.";
});
/* Edge Permutation (5) & Corner Permutation (15) — reference algorithms */
const EP = [
  {id:"EP1",alg:"R2 U2' R2' U' R2 U2' R2'"},
  {id:"EP2",alg:"R2 U2 R2' U R2 U2 R2'"},
  {id:"EP3",alg:"R U R' F' R U R' U' R' F R2 U' R'"},
  {id:"EP4",alg:"R U R' U R' U' R2 U' R' U R' U R U2'"},
  {id:"EP5",alg:"L R U2 L' U R' L U' R U2 L' U2 R'"}
];
EP.forEach(e=>e.src="CubeSkills 4LLL / SpeedCubeDB "+e.id);
const CP = [
  {id:"CP1",alg:"R' BR' R BR R' F' R BR' R' BR F R"},
  {id:"CP2",alg:"R' F' BR' R BR R' F R BR' R' BR R"},
  {id:"CP3",alg:"BR' R' U L U' R' U L' U' R2 BR"},
  {id:"CP4",alg:"BR' R2' U L U' R U L' U' R BR"},
  {id:"CP5",alg:"L' R U2 R' U' R U R' U' R U R' U' R U' R' L"},
  {id:"CP6",alg:"R U R' U R' U' R F' R U R' U' R' F R2 U' R2' U R U'"},
  {id:"CP7",alg:"R2 U R' U' y R U R' U' R U R' U' R U R' y' R U' R2'"},
  {id:"CP8",alg:"F R U2 R' U' R U' R' F' R' y' R' U' R U' R' U2 R BR U'"},
  {id:"CP9",alg:"R U R' U R' U' R2 U' R' U R' U R U R U R' U R' U' R2 U' R' U R' U R U"},
  {id:"CP10",alg:"R2 U2 R2' U' R2 U' R2' y' R2' U' R2 U' R2' U2 R2"},
  {id:"CP11",alg:"R2' U2' R2 U R2' U R2 y R2 U R2' U R2 U2' R2'"},
  {id:"CP12",alg:"R2 U2' R2' U' R2 U2' R' U R' U' R' F R2 U' R' U' R U R' F'"},
  {id:"CP13",alg:"R' U2 R U' R' U2 R U2' R' U' R U2' R' U R U2' R' U R"},
  {id:"CP14",alg:"R2 U2' R2' U' R2 U R2' U' R2 U R2' U' R2 U2' R2'"},
  {id:"CP15",alg:"R2 U2 R2' U R2 U' R2' U R2 U' R2' U R2 U2 R2'"}
];
CP.forEach(c=>c.src="CubeSkills 4LLL / SpeedCubeDB "+c.id);

/* ---------- Beginner method (Speedsolving Wiki, prose) ---------- */
const BEGINNER = {
  eo:[
    {when:"Two bad edges NEXT TO each other",hold:"Put one bad edge at the FRONT and the other on the RIGHT.",alg:"F U R U' R' F'"},
    {when:"Two bad edges FAR APART (a good edge between)",hold:"Put one bad edge at the FRONT and the other at the BACK-RIGHT.",alg:"F R U R' U' F'"},
    {when:"Four bad edges",hold:"Put the only good edge at the BACK-LEFT, then do a 2-edge algorithm and look again.",alg:"F U R U' R' F'  (then repeat)"}
  ],
  co:{alg:"R' D' R D",how:"Hold one not-done corner at the FRONT-RIGHT-TOP. Do R' D' R D again and again (2 or 4 times) until JUST that corner's yellow points up. Don't panic — the puzzle looks messy, that's normal! Then turn ONLY the top (U) to bring the next unfinished corner to front-right-top. Repeat for all 5. The lower part fixes itself at the end."},
  src:"Speedsolving.com Wiki — Megaminx LL (beginner)"
};

/* ---------- FULL SOLVE roadmap (verified, beginner method) ----------
   Sources: CubeSkills "Beginner Megaminx Tutorial" (Star & F2L, S2L, Last Layer),
   Speedsolving Wiki Megaminx LL, and standard layer-by-layer beginner method
   (speedcube.us / GAN / ruwix). Second-layer edge inserts are the classic
   3x3 beginner left/right algorithms, applied to the Megaminx.            */
const FULL_SOLVE = [
  {n:1, key:"star", icon:"⭐", name:"Make the first-face star",
   goal:"Pick a starting colour (we'll say white). Build a 5-point star: put each white edge so its white sticker is on the white face AND its side colour matches the centre next to it.",
   tip:"This step is all thinking, no algorithm needed. Just turn pieces into place like a puzzle. Take your time — there are 5 edges, not 4 like a 3×3.",
   algs:[], src:"CubeSkills Beginner Megaminx — Star & F2L",
   levels:null},
  {n:2, key:"corners", icon:"🧱", name:"First-layer corners",
   goal:"Now fill in the 5 white corners so the whole white face and its first ring are done.",
   tip:"Find a white corner in the TOP layer, sitting right above the slot where it belongs. Then repeat the trigger until it drops in correctly. Hold the slot at the front-right.",
   algs:[{label:"Repeat until the corner is in", alg:"R U R' U'"}],
   src:"CubeSkills Beginner Megaminx / standard layer-by-layer method",
   levels:[
     {id:"beginner", title:"Beginner", body:"Just repeat <span class='kbd'>R U R' U'</span> until the white corner pops into place the right way up. It might take 1, 3 or 5 tries — that's normal."},
     {id:"advanced", title:"Faster", body:"Pair the corner with its edge first (mini-F2L) and insert them together, like 3×3 F2L. Fewer moves once you get the feel."}
   ]},
  {n:3, key:"s2l", icon:"🔗", name:"Second layer edges (S2L)",
   goal:"Turn the solved white face to the BOTTOM. Now place the edges of the next layer using two mirror algorithms — exactly like the second layer of a 3×3.",
   tip:"Find a top edge with NO yellow/last-layer colour on it. Line its front colour up with a matching centre, then send it LEFT or RIGHT into its slot.",
   algs:[
     {label:"Send the edge to the RIGHT", alg:"U R U' R' U' F' U F"},
     {label:"Send the edge to the LEFT",  alg:"U' L' U L U F U' F'"}
   ],
   src:"CubeSkills Beginner Megaminx — S2L / standard beginner second-layer algorithms",
   levels:[
     {id:"beginner", title:"Beginner", body:"Use the two mirror algorithms above, one slot at a time. If an edge is stuck in the wrong slot, send any top edge in to kick it out, then fix it."},
     {id:"advanced", title:"Intuitive S2L", body:"Solve the corner-edge pair together and insert intuitively (like 3×3 F2L). On the Megaminx this is called S2L."}
   ]},

/* =====================================================================
   GEOMETRY — draw a Megaminx last layer that looks like the real puzzle
   ===================================================================== */
const DEG=Math.PI/180;
function penta(cx,cy,r,rot){ // 5 points, one vertex up
  const p=[]; for(let i=0;i<5;i++){const a=(-90+72*i+rot)*DEG; p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);} return p;
}
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];}
function pts(arr){return arr.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");}

/* Build the 11 top-face facelets + 5 side panels (pseudo-3D rim). */
function buildFaceGeom(cx,cy,R){
  const Rc=R*0.34, g=0.30;
  const A=penta(cx,cy,R,0);       // outer vertices
  const C=penta(cx,cy,Rc,0);      // centre pentagon vertices
  const eS=[],eE=[];
  for(let i=0;i<5;i++){const j=(i+1)%5; eS[i]=lerp(A[i],A[j],g); eE[i]=lerp(A[i],A[j],1-g);}
  const corners=[],edges=[];
  for(let i=0;i<5;i++){
    const j=(i+1)%5, im=(i+4)%5;
    edges[i]=[eS[i],eE[i],C[j],C[i]];                 // trapezoid centred on edge i
    corners[i]=[A[i],eS[i],C[i],eE[im]];              // kite at vertex i
  }
  const centre=C;
  // side panels: a beveled rim outside each outer edge -> reads as 3D sides
  const sides=[];
  for(let i=0;i<5;i++){
    const j=(i+1)%5;
    const mid=[(A[i][0]+A[j][0])/2,(A[i][1]+A[j][1])/2];
    const out=[mid[0]-cx,mid[1]-cy];
    const len=Math.hypot(out[0],out[1]); out[0]/=len; out[1]/=len;
    const depth=R*0.30;
    const o1=[A[i][0]+out[0]*depth, A[i][1]+out[1]*depth];
    const o2=[A[j][0]+out[0]*depth, A[j][1]+out[1]*depth];
    sides[i]=[A[i],A[j],o2,o1];
  }
  return {corners,edges,centre,sides,A};
}

/* Render one last-layer view as SVG string.
   opts: corners[5],edges[5] (true=top colour), size, clickable, highlightFace(idx),
         turnDir (1 cw / -1 ccw) for arrow, ghostSides(bool), rot(deg of top group) */
function renderLL(opts){
  const o=Object.assign({size:300,corners:[1,1,1,1,1],edges:[1,1,1,1,1],clickable:false,
    highlightFace:-1,turnDir:0,rot:0,topColor:COLORS.top},opts);
  const S=o.size, cx=S/2, cy=S/2+S*0.02, R=S*0.34;
  const G=buildFaceGeom(cx,cy,R);
  const top=o.topColor, grey=COLORS.grey;
  let s=`<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">`;
  s+=`<defs>
      <radialGradient id="bodyg" cx="50%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#3a4170"/><stop offset="100%" stop-color="#0b0e22"/></radialGradient>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/></filter>
    </defs>`;
  // dark puzzle body behind everything
  const body=penta(cx,cy,R*1.42,0);
  s+=`<polygon points="${pts(body)}" fill="url(#bodyg)" stroke="#05060f" stroke-width="2" filter="url(#sh)"/>`;
  // side panels (3D rim) — coloured like neighbour faces, dimmed
  for(let i=0;i<5;i++){
    const c=COLORS.sides[i%5];
    s+=`<polygon points="${pts(G.sides[i])}" fill="${c}" opacity="${o.ghostSides?0.32:0.62}" stroke="#05060f" stroke-width="1.4"/>`;
  }
  // top-face group (can rotate for U-turn animation)
  s+=`<g transform="rotate(${o.rot} ${cx} ${cy})" style="transition:transform .5s cubic-bezier(.5,.05,.3,1)">`;
  const tile=(poly,fill,kind,idx)=>{
    const cls="facelet"+(o.clickable&&kind!=='centre'?" clickable":"");
    return `<polygon class="${cls}" points="${pts(poly)}" fill="${fill}" stroke="#0a0c1c" stroke-width="2"
      ${o.clickable&&kind!=='centre'?`data-kind="${kind}" data-idx="${idx}"`:""}/>`;
  };
  // centre
  s+=tile(G.centre,top,'centre',-1);
  // edges & corners
  for(let i=0;i<5;i++){
    s+=tile(G.edges[i], o.edges[i]?top:grey, 'edge', i);
    s+=tile(G.corners[i], o.corners[i]?top:grey, 'corner', i);
  }
  // face highlight for move guidance
  if(o.highlightFace>=0 && o.highlightFace<5){
    const hp=[G.A[o.highlightFace],G.A[(o.highlightFace+1)%5],G.sides[o.highlightFace][2],G.sides[o.highlightFace][3]];
    s+=`<polygon points="${pts(hp)}" fill="none" stroke="#fff" stroke-width="4" opacity="0.95">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/></polygon>`;
  }
  s+=`</g>`;
  s+=`</svg>`;
  return s;
}

/* =====================================================================
   RECOGNITION — rotation invariant, never guesses
   ===================================================================== */
function rotArr(a,k){const n=a.length;return a.map((_,i)=>a[(i-k+n)%n]);}
function eq(a,b){return a.every((v,i)=>!!v===!!b[i]);}
function matchCase(corners,edges){
  // returns {status:'solved'|'one'|'many'|'none', list:[caseObj...]}
  const allEdge=edges.every(Boolean), allCorner=corners.every(Boolean);
  if(allEdge&&allCorner) return {status:'solved',list:[]};
  const pool = allEdge ? CO : EO;   // edges first, then corners (real solving order)
  const hits=[];
  for(const c of pool){
    const d=decodeTop(c.top);
    for(let k=0;k<5;k++){
      if(eq(corners,rotArr(d.corners,k)) && eq(edges,rotArr(d.edges,k))){ hits.push(c); break; }
    }
  }
  // unique by id
  const uniq=[]; const seen=new Set();
  for(const h of hits){ if(!seen.has(h.id)){seen.add(h.id);uniq.push(h);} }
  if(uniq.length===0) return {status:'none',list:[]};
  if(uniq.length===1) return {status:'one',list:uniq};
  return {status:'many',list:uniq};
}

/* =====================================================================
   MOVE PARSING + animated player
   ===================================================================== */
function parseAlg(alg){
  return alg.trim().split(/\s+/).filter(Boolean);
}
// which top-face index a move's face maps to in our drawing (for the highlight)
const FACE_INDEX={F:0,R:1,BR:2,DR:3,L:4,BL:4,U:-1,y:-1,"y2":-1};
function moveInfo(m){
  const base=m.replace(/['2]/g,"");
  const prime=m.includes("'");
  const dbl=m.includes("2");
  const face=base;
  const idx = face==="U"||face==="y" ? -1 : (FACE_INDEX[face]!==undefined?FACE_INDEX[face]:1);
  return {raw:m,face,prime,dbl,idx};
}

function scrFullSolve(){
  const lvl=state.solveLevel;
  const levelBtn=(id,label)=>`<button class="btn sm ${lvl===id?'':'ghost'}" data-solvelvl="${id}">${label}</button>`;
  const stageCard=(s)=>{
    const algBlock = s.algs.length? `<div style="margin-top:8px">${s.algs.map(a=>
        `<div style="margin-bottom:6px"><div class="muted" style="font-size:12.5px">${a.label}</div>
         <div class="alg">${a.alg}</div></div>`).join("")}</div>` : "";
    let levelBlock="";
    if(s.levels){
      const chosen = s.levels.find(L=>L.id===lvl) || s.levels.find(L=>L.id==="beginner") || s.levels[0];
      levelBlock=`<div class="coach" style="margin-top:8px"><div class="face">${lvl==='beginner'?'🌱':'🚀'}</div>
        <div class="bubble"><b>${chosen.title}:</b> ${chosen.body}
        ${chosen.go?`<div class="row" style="margin-top:8px">
          <button class="btn sm" data-solvego="${chosen.go}" data-solveadv="${chosen.adv?1:0}">Open it →</button></div>`:""}
        </div></div>`;
    }
    return `<div class="card" style="margin-bottom:14px">
      <div class="row between">
        <h3 style="margin:0">${s.icon} Step ${s.n} · ${s.name}</h3>
        <span class="tag verified">verified</span>
      </div>
      <p style="margin:.4em 0">${s.goal}</p>
      <p class="muted" style="font-size:13px">${s.tip}</p>
      ${algBlock}
      ${levelBlock}
      <div class="src" style="margin-top:8px">Source: ${s.src}</div>
    </div>`;
  };
  return `
  <div class="card">
    <h2>🗺️ Solve the Whole Megaminx</h2>
    <p class="muted">A full solve goes from the very first piece all the way to the finished puzzle.
    Each step builds on the one before. Every step is checked against trusted cubing guides — nothing is made up.</p>

      <b>Coach Owl:</b> Pick how much you want to learn. <b>Beginner</b> uses a few simple moves you repeat.
      <b>Advanced</b> uses more algorithms but is faster — like full <b>OLL</b>. You can switch any time!</div></div>
    <div class="row" style="margin-top:12px">
      <span class="muted" style="font-size:13px">Difficulty:</span>

    </div>
    <div class="progressbar" style="margin:14px 0 4px"><div style="width:100%"></div></div>
    <p class="muted" style="font-size:12px">6 steps from scramble to solved.</p>
  </div>
  ${FULL_SOLVE.map(stageCard).join("")}
  <div class="card">
    <div class="coach"><div class="face">🏁</div><div class="bubble">
      <b>That's the whole solve!</b> Star → first layer → middle layers → last layer (OLL then PLL).
      Practise one step until it's easy, then add the next. You've got this, Adoni! 💪</div></div>
  </div>`;
}

/* ---- Self-test ---- */
function runTests(){
  const t=[];
  const add=(name,pass,detail="")=>t.push({name,pass,detail});
  // 1. every EO/CO has 11-char pattern, centre logic, edges-all-y for CO
  EO.forEach(c=>add("EO "+c.id+" pattern length 11", c.top.length===11));
  CO.forEach(c=>add("CO "+c.id+" pattern length 11", c.top.length===11));
  CO.forEach(c=>{const d=decodeTop(c.top); add("CO "+c.id+" edges all oriented", d.edges.every(Boolean));});
  // 2. edge-flip parity: number of flipped edges in each EO case is even
  EO.forEach(c=>{const d=decodeTop(c.top);const flipped=d.edges.filter(x=>!x).length;
    add("EO "+c.id+" edge-flip parity even", flipped%2===0, flipped+" flipped");});
  // 3. corner twist count never exactly 1 (impossible on a real puzzle)
  CO.forEach(c=>{const d=decodeTop(c.top);const bad=d.corners.filter(x=>!x).length;
    add("CO "+c.id+" corner count valid (not 1)", bad!==1, bad+" twisted");});
  // 4. U-rotation is a clean 5-cycle: rotArr 5 times == identity
  {const a=[1,0,2,0,1];let r=a.slice();for(let i=0;i<5;i++)r=rotArr(r,1);
    add("U-rotation has order 5", eq(r.map(Boolean),a.map(Boolean)));}
  // 5. recognition: every verified case is matched to itself uniquely (or grouped only with same-top cases)
  [...EO,...CO].forEach(c=>{const d=decodeTop(c.top);const m=matchCase(d.corners,d.edges);
    const ok=m.status!=='none' && m.list.some(x=>x.id===c.id);
    add("Recognise "+c.id, ok, m.status);});
  // 6. recognition rotation-invariance: a rotated copy still matches the same set
  [...EO,...CO].forEach(c=>{const d=decodeTop(c.top);
    const rc=rotArr(d.corners,2), re=rotArr(d.edges,2);
    const m=matchCase(rc,re); add("Rotation-invariant "+c.id, m.list.some(x=>x.id===c.id), m.status);});
  // 7. no algorithm is empty & uses only known tokens
  const known=/^[URFLDB]+R?2?'?$|^y2?'?$|^(BR|DR|BL|DL)2?'?$/;
  [...EO,...CO,...EP,...CP].forEach(c=>{
    const toks=parseAlg(c.alg); const allok=toks.length>0 && toks.every(m=>/^[A-Za-z]+2?'?$/.test(m));
    add("Algorithm well-formed "+c.id, allok);});
  // 8. other-puzzle libraries are complete and non-empty
  if(typeof OLL3!=="undefined"){ add("3x3 OLL set has 57 cases", OLL3.length===57, OLL3.length+"");
    add("3x3 OLL all non-empty", OLL3.every(o=>o.alg&&o.alg.trim().length>0)); }
  if(typeof PLL3!=="undefined"){ add("3x3 PLL set has 21 cases", PLL3.length===21, PLL3.length+"");
    add("3x3 PLL all non-empty", PLL3.every(p=>p.alg&&p.alg.trim().length>0)); }
  if(typeof PYRA!=="undefined"){ add("Pyraminx set non-empty", PYRA.length>0 && PYRA.every(p=>p.alg)); }
  return t;
}
function scrTests(){
  const t=runTests();
  const pass=t.filter(x=>x.pass).length;
  return `
  <div class="card">
    <h2>Self-Test & Verification</h2>
    <p class="muted">These checks run inside the app. They prove the case data is internally consistent and the
    recognition engine behaves correctly. Result: <b class="${pass===t.length?'ok':'fail'}">${pass}/${t.length} passed</b>.</p>
    <div>${t.map(x=>`<div class="testrow"><span>${x.name}</span>
      <span class="${x.pass?'ok':'fail'}">${x.pass?'PASS':'FAIL'} <span class="muted">${x.detail}</span></span></div>`).join("")}</div>
    <p class="muted" style="font-size:12.5px;margin-top:12px">What this does and doesn't claim: it verifies the
    <b>data integrity</b> (pattern shape, parity, corner-twist legality), the <b>recognition engine</b> (every verified
    case is found, and recognition is rotation-invariant), and that every <b>algorithm is well-formed</b>. The algorithm
    <i>move sequences themselves</i> are trusted because they are transcribed verbatim from the cited references, not generated.</p>
  </div>`;
}

function startPlayer(id){
  const c=teachOf(id); const moves=parseAlg(c.alg);
  state.player={id,moves,i:-1,speed:900,playing:false,baseRot:0};
}
function playerRenderStep(){
  const p=state.player; if(!p) return;
  const c=teachOf(p.id); const d=decodeTop(c.top);
  // highlight current move's face; rotate top group a little for U moves to imply motion
  let hl=-1, rot=p.baseRot;
  const msgEl=document.getElementById("coachMsg");
  document.querySelectorAll("#moveChips .movechip").forEach((el,idx)=>{
    el.classList.toggle("done",idx<p.i);
    el.classList.toggle("current",idx===p.i);
  });
  if(p.i>=0 && p.i<p.moves.length){
    const mi=moveInfo(p.moves[p.i]);
    hl=mi.idx;
    if(mi.face==="U"||mi.face==="y"){ p.baseRot += (mi.prime?72:-72)*(mi.dbl?2:1); rot=p.baseRot; hl=-1; }
    const dirWord = mi.prime?"the OTHER way (anti-clockwise)":"clockwise";
    const faceWord = {F:"FRONT",R:"RIGHT",L:"LEFT",BR:"BACK-RIGHT",DR:"DOWN-RIGHT",U:"TOP",y:"WHOLE puzzle"}[mi.face]||mi.face;
    if(msgEl) msgEl.innerHTML = `Move ${p.i+1} of ${p.moves.length}: <b>${mi.raw}</b> — turn the <b>${faceWord}</b> face ${dirWord}${mi.dbl?" twice":""}.`;
  } else if(p.i>=p.moves.length){
    if(msgEl) msgEl.innerHTML = `<b>Done! 🎉</b> The top should now be ${state.topColorName==="Yellow"?"all yellow":"all "+state.topColorName.toLowerCase()}. If it is — press "I solved it!".`;
    const st=document.getElementById("teachStage"); if(st) st.innerHTML=renderLL({size:330,corners:[1,1,1,1,1],edges:[1,1,1,1,1]});
    return;
  }
  const st=document.getElementById("teachStage");
  if(st) st.innerHTML=renderLL({size:330,corners:d.corners,edges:d.edges,highlightFace:hl,rot:rot});
}
function playerStep(){ const p=state.player; if(!p) return; if(p.i<p.moves.length){p.i++;} playerRenderStep(); }
function playerBack(){ const p=state.player; if(!p) return; if(p.i>=0){p.i--;} if(p.i<0)p.baseRot=0; playerRenderStep(); }
function playerReset(){ const p=state.player; if(!p) return; p.i=-1;p.baseRot=0;p.playing=false; playerRenderStep(); }
function playerPlay(){
  const p=state.player; if(!p) return; p.playing=!p.playing;
  if(p.playing){ if(p.i>=p.moves.length){p.i=-1;p.baseRot=0;} const tick=()=>{
    if(!state.player||!state.player.playing) return;
    if(p.i>=p.moves.length){p.playing=false;return;}
    playerStep(); if(p.i<=p.moves.length) setTimeout(tick,p.speed);
  }; tick(); }
}

  const pool=[...EO,...(state.showAdvanced?CO:[])];
  const c=pickRandom(pool); const d=decodeTop(c.top);
  // build options (unique ids) — never ask for more than exist (prevents freeze)
  const need=Math.min(4,pool.length);
  const opts=[c]; let guard=0; while(opts.length<need && guard++<200){const o=pickRandom(pool); if(!opts.find(x=>x.id===o.id))opts.push(o);}
  opts.sort(()=>Math.random()-0.5);
  document.getElementById("pracArea").innerHTML=`

      <div class="stage">${renderLL({size:240,corners:d.corners,edges:d.edges})}</div>

  });

  // practice

    const p=b.dataset.prac; if(p==='recognize')pracRecognize(); else if(p==='choose')pracChoose(); else pracQuiz();
  });

    const ok=b.dataset.ans===b.dataset.correct; const msg=document.getElementById("pracMsg");

    if(ok){state.progress[b.dataset.correct]=state.progress[b.dataset.correct]||{solved:0};state.progress[b.dataset.correct].solved++;saveProgress();}
  });
}

/* =====================================================================
   3D 3x3 CUBE VIEWER (Three.js) — engine verified separately (25/25)

let CUBE_COLORS={U:"#ffd21f",D:"#f4f4ec",F:"#27ae60",B:"#2f6bff",R:"#e23b3b",L:"#ff8c1a",core:"#0a0c14"};

const CUBE3D = (function(){

  const UNIT=1.04;

/* ---- Photo helper (assisted, never auto-guesses) ---- */
const photo={img:null,taps:[],samples:[],active:false};
function rgbDist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);}
const PHOTO_STEPS=["the CENTRE of the top face",
  "a CORNER sticker (start anywhere)","the EDGE next to it (going clockwise)",
  "the next CORNER","the next EDGE","the next CORNER","the next EDGE",
  "the next CORNER","the next EDGE","the last CORNER","the last EDGE"];
function photoLoad(file){
  const c=document.getElementById("photoCanvas"); if(!c)return;
  const img=new Image();
  img.onload=()=>{ const W=Math.min(360,img.width); const sc=W/img.width;
    c.width=W; c.height=Math.round(img.height*sc); c.style.display="block";
    const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height);
    photo.img=img; photo.taps=[]; photo.samples=[]; photo.active=false;
    document.getElementById("photoStart").disabled=false;
    document.getElementById("photoRedo").disabled=false;
    setPhotoMsg("Photo loaded! Press <b>Start tapping</b>, then tap "+PHOTO_STEPS[0]+".");
  };
  const r=new FileReader(); r.onload=e=>img.src=e.target.result; r.readAsDataURL(file);
}
function setPhotoMsg(h){const m=document.getElementById("photoMsg"); if(m)m.innerHTML=h;}
function photoRedraw(){
  const c=document.getElementById("photoCanvas"); if(!c||!photo.img)return;
  const ctx=c.getContext("2d"); ctx.drawImage(photo.img,0,0,c.width,c.height);
  photo.taps.forEach((t,i)=>{ctx.beginPath();ctx.arc(t.x,t.y,9,0,7);ctx.fillStyle="rgba(0,0,0,.55)";ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle="#fff";ctx.stroke();ctx.fillStyle="#fff";ctx.font="11px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(i,t.x,t.y);});
}
function photoClick(e){
  if(!photo.active)return; const c=document.getElementById("photoCanvas"); const r=c.getBoundingClientRect();
  const x=Math.round((e.clientX-r.left)*(c.width/r.width)), y=Math.round((e.clientY-r.top)*(c.height/r.height));
  const ctx=c.getContext("2d"); const px=ctx.getImageData(Math.max(0,x-2),Math.max(0,y-2),5,5).data;
  let R=0,G=0,B=0,n=0; for(let i=0;i<px.length;i+=4){R+=px[i];G+=px[i+1];B+=px[i+2];n++;}
  photo.samples.push([R/n,G/n,B/n]); photo.taps.push({x,y}); photoRedraw();
  if(photo.taps.length<11){ setPhotoMsg(`Good! (${photo.taps.length}/11) Now tap <b>${PHOTO_STEPS[photo.taps.length]}</b>.`); }
  else { photo.active=false; photoFinish(); }
}
function photoFinish(){
  const ref=photo.samples[0];
  const ds=photo.samples.slice(1).map(s=>rgbDist(s,ref)); const mx=Math.max(...ds,1);
  const isTop=d=>d<Math.max(60,0.5*mx);
  const corners=[],edges=[];
  for(let k=0;k<5;k++){ corners.push(isTop(rgbDist(photo.samples[1+2*k],ref)));
                        edges.push(isTop(rgbDist(photo.samples[2+2*k],ref))); }
  state.builder={corners,edges};
  toast("Read your photo! Result shown at the top ☝️");
  render(); // shows the no-guess recognition result; user can fine-tune by clicking stickers
}
function wirePhoto(){
  const inp=document.getElementById("photoInput"); if(inp) inp.onchange=e=>{if(e.target.files[0])photoLoad(e.target.files[0]);};
  const st=document.getElementById("photoStart"); if(st) st.onclick=()=>{photo.active=true;photo.taps=[];photo.samples=[];photoRedraw();setPhotoMsg("Tap <b>"+PHOTO_STEPS[0]+"</b>.");};
  const rd=document.getElementById("photoRedo"); if(rd) rd.onclick=()=>{photo.active=false;photo.taps=[];photo.samples=[];photoRedraw();setPhotoMsg("Cleared. Press <b>Start tapping</b> to begin again.");};
  const cv=document.getElementById("photoCanvas"); if(cv) cv.onclick=photoClick;
}

function cubeOLLSig(alg){
  const rotV=(p,a,q)=>{let [x,y,z]=p;const n=((q%4)+4)%4;for(let i=0;i<n;i++){if(a==='x'){[y,z]=[-z,y];}else if(a==='y'){[x,z]=[z,-x];}else{[x,y]=[-y,x];}}return [x,y,z];};
  const F={R:{ax:'x',sg:1,s:-1},L:{ax:'x',sg:-1,s:1},U:{ax:'y',sg:1,s:-1},D:{ax:'y',sg:-1,s:1},F:{ax:'z',sg:1,s:-1},B:{ax:'z',sg:-1,s:1},M:{ax:'x',sg:0,s:1,sl:1},E:{ax:'y',sg:0,s:1,sl:1},S:{ax:'z',sg:0,s:-1,sl:1},X:{ax:'x',s:-1,all:1},Y:{ax:'y',s:-1,all:1},Z:{ax:'z',s:-1,all:1}};
  const maxc=2;
  const md=tok=>{const m=tok.match(/^(\d*)([RLUDFBMESxyz])(w?)(2?)('?)$/);if(!m)return null;const num=m[1]?parseInt(m[1]):0,base=m[2],wide=m[3]==='w',dbl=m[4]==='2',pr=m[5]==="'";const f=F[base.toUpperCase()];if(!f)return null;let L=[];if(f.all){for(let c=-maxc;c<=maxc;c+=2)L.push(c);}else if(f.sl){for(let c=-maxc+2;c<=maxc-2;c+=2)L.push(c);}else{const lo=/[rludfb]/.test(base),w=wide||lo;if(w){const d=num||2;for(let k=0;k<d;k++)L.push(f.sg*(maxc-2*k));}else if(num){L=[f.sg*(maxc-2*(num-1))];}else{L=[f.sg*maxc];}}return {ax:f.ax,L,q:(dbl?2:1)*(pr?-1:1)*f.s};};
  const iv=a=>a.trim().split(/\s+/).reverse().map(t=>{const m=t.match(/^(\d*[RLUDFBMESxyz]w?)(2?)('?)$/);return m?(m[1]+(m[2]?"2":(m[3]?"":"'"))):t;}).join(" ");
  let cu=[];for(let x=-maxc;x<=maxc;x+=2)for(let y=-maxc;y<=maxc;y+=2)for(let z=-maxc;z<=maxc;z+=2)cu.push({pos:[x,y,z],uy:[0,1,0]});
  iv(alg).split(/\s+/).filter(Boolean).forEach(t=>{const d=md(t);if(!d)return;cu.forEach(c=>{const v=c.pos[d.ax==='x'?0:d.ax==='y'?1:2];if(d.L.some(l=>Math.abs(l-v)<1e-9)){c.pos=rotV(c.pos,d.ax,d.q);c.uy=rotV(c.uy,d.ax,d.q);}});});
  const cells=cu.filter(c=>c.pos[1]===2).map(c=>({x:c.pos[0],z:c.pos[2],up:(c.uy[0]===0&&c.uy[1]===1&&c.uy[2]===0)?1:0}));
  cells.sort((a,b)=>a.z-b.z||a.x-b.x);return cells.map(c=>c.up).join("");
}
function cubeMatchOLL(painted){
  const g=painted.map(b=>b?1:0),cx=[-2,0,2];
  const rot=gr=>{const out=Array(9);for(let i=0;i<9;i++){const X=cx[i%3],Z=cx[(i/3)|0],sx=-Z,sz=X,si=cx.indexOf(sz)*3+cx.indexOf(sx);out[i]=gr[si];}return out;};
  const rots=[g];for(let k=0;k<3;k++)rots.push(rot(rots[rots.length-1]));
  const strs=rots.map(r=>r.join(""));
  return OLL3.filter(o=>strs.includes(o.sig));
}
function scrPIdentify(){const p=P();
  if(p.cases&&p.cases.some(gp=>gp.kind==='pyra')){
    const hints={"Sune (3 edges cycle)":"All 3 last edges show the right colours but need to rotate around — clockwise.","Anti-Sune (3 edges cycle)":"Same as Sune but the 3 edges cycle the other way (anti-clockwise).","Lefty Bars":"Two edges already line up as a matching bar on the left side.","Righty Bars":"Two edges line up as a matching bar on the right side.","2 Flip":"Two of the last edges are flipped — showing the wrong colour facing out."};
    const g=p.cases.find(gp=>gp.kind==='pyra');
    const cards=g.list.map((c,i)=>'<div class="casecard" data-case="pyra:'+i+'" title="Watch in 3D"><div class="nm">'+c.name+'</div><div class="src" style="font-size:10.5px">'+(hints[c.name]||"")+'</div><div class="al">'+c.alg+'</div><div class="src" style="font-size:10px;color:var(--accent)">▶ tap for 3D</div></div>').join("");
    return '<div class="card"><h2>🧩 '+p.name+' — Find your case</h2><p class="muted">First solve one face and the centres. Then look at the <b>last 3 edges</b> around the top tip and match them to one of these. Tap to watch the fix in 3D. (Only 5 cases — you\'ll know them fast!)</p><div class="caselist">'+cards+'</div></div>';
  }
  if(!(p.cases&&p.cases.some(gp=>gp.kind==='oll'))) return '<div class="card"><h2>🧩 '+p.name+' — Identify</h2><p class="muted">A case-finder for this puzzle is coming. For now, browse the Case Library.</p><button class="btn sm" data-go="plibrary">Open Case Library →</button></div>';
  if(!state.cubePaint) state.cubePaint=[true,true,true,true,true,true,true,true,true];
  const tc=CUBE_COLORS.U,gc="#8b93b8";
  const grid='<div style="display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;justify-content:center">'+
    state.cubePaint.map((v,i)=>'<div data-paint="'+i+'" style="width:54px;height:54px;border-radius:8px;border:2px solid #0a0c1c;cursor:'+(i===4?'default':'pointer')+';background:'+(v?tc:gc)+'"></div>').join("")+'</div>';
  const m=cubeMatchOLL(state.cubePaint);let res;
  if(state.cubePaint.every(Boolean)) res='<div class="coach"><div class="face">🎉</div><div class="bubble">The top is all one colour — a solved top. Tap the squares that are NOT the top colour to enter your case.</div></div>';
  else if(m.length===0) res='<div class="coach" style="border-color:#7a4b15"><div class="face">🤔</div><div class="bubble"><b>I can\'t confirm this yet.</b> Tap the squares so they match your cube exactly (yellow = top colour, grey = not).</div></div>';
  else if(m.length===1) res='<div class="coach" style="border-color:#1f6b3f"><div class="face">✅</div><div class="bubble"><b>Found it: OLL '+m[0].n+'</b><div class="row" style="margin-top:8px"><button class="btn sm good" data-case="oll:'+OLL3.indexOf(m[0])+'">Watch it in 3D →</button></div></div></div>';
  else res='<div class="coach" style="border-color:#7a4b15"><div class="face">🔎</div><div class="bubble"><b>Almost!</b> A few cases share this top shape — check the side stickers. Candidates: '+m.map(o=>'OLL '+o.n).join(", ")+'.</div></div>';
  return '<div class="card"><h2>🧩 '+p.name+' — Identify your case</h2><p class="muted">Look at the top of your cube. Tap the squares so yellow = the top colour, grey = not. I find the OLL case and never guess.</p><div class="stage">'+grid+'</div><div class="row" style="justify-content:center"><button class="btn sm ghost" data-paintact="clear">Only centre</button><button class="btn sm ghost" data-paintact="reset">All top colour</button></div>'+res+'</div>';
}
function scrPColors(){const p=P();
  if(p.engine!=='cube') return '<div class="card"><h2>🎨 '+p.name+' — My Colours</h2><p class="muted">This puzzle uses its standard colours.</p></div>';
  const faces=['U','F','R','D','L','B'];
  return '<div class="card"><h2>🎨 '+p.name+' — My Colours</h2><p class="muted">Set the colours to match your real cube. They show in the 3D trainer.</p><div class="legend">'+
    faces.map(f=>'<span class="chip"><span class="sw" style="background:'+CUBE_COLORS[f]+'"></span>'+CUBE_COLOR_NAMES[f]+' <input type="color" value="'+CUBE_COLORS[f]+'" data-ccolor="'+f+'" style="width:26px;height:22px;border:none;background:none;cursor:pointer"></span>').join("")+
    '</div><div class="row" style="margin-top:12px"><button class="btn sm" data-cact="save">Save</button><button class="btn sm ghost" data-cact="reset">Reset</button><button class="btn sm ghost" data-go="pplay">See it in 3D →</button></div></div>';
}
function scrPParent(){const p=P();
  let rows='';p.cases.forEach(g=>{rows+='<tr><th colspan="2">'+g.group+'</th></tr>'+g.list.map(c=>{const nm=c.n!==undefined?(g.kind==='oll'?'OLL '+c.n:c.n):c.name;return '<tr><td>'+nm+'</td><td class="mono">'+c.alg+'</td></tr>';}).join("");});
  return '<div class="card"><h2>👨‍👦 '+p.name+' — Parent / Coach</h2><p class="muted">Every algorithm shown, with its source. Nothing invented.</p>'+
    '<div class="row"><button class="btn sm ghost" data-act="resetprogress">Reset progress</button><button class="btn sm ghost" data-go="pprint">Printable sheet</button></div>'+
    '<table class="algtbl"><tr><th>Case</th><th>Algorithm</th></tr>'+rows+'</table><p class="src" style="margin-top:8px">Source: SpeedCubeDB.</p></div>';
}
function scrPPrint(){const p=P();
  let blocks='';p.cases.forEach(g=>{blocks+='<h3>'+g.group+'</h3><div class="caselist">'+g.list.map(c=>{const nm=c.n!==undefined?(g.kind==='oll'?'OLL '+c.n:c.n):c.name;return '<div class="casecard" style="cursor:default"><div class="nm">'+nm+'</div><div class="al">'+c.alg+'</div></div>';}).join("")+'</div>';});
  return '<div class="card noprint"><h2>🖨️ '+p.name+' — Printable</h2><p class="muted">Print or save as PDF (Ctrl/Cmd+P).</p><button class="btn" onclick="window.print()">🖨️ Print now</button></div><h2>'+p.name+' cheat sheet</h2>'+blocks;
}
function scrPTests(){const p=P();const t=[];const add=(n,b)=>t.push([n,b]);
  add("Has case groups",p.cases&&p.cases.length>0);let total=0;
  (p.cases||[]).forEach(g=>{add(g.group+": non-empty",g.list.length>0);total+=g.list.length;add(g.group+": all algorithms present",g.list.every(c=>c.alg&&c.alg.trim().length>0));});
  const re=/^[A-Za-z0-9']+$/;let bad=0;(p.cases||[]).forEach(g=>g.list.forEach(c=>{if(!c.alg.trim().split(/\s+/).every(m=>re.test(m)))bad++;}));
  add("All moves well-formed",bad===0);add("3D engine available",!!engineObj(p));
  const pass=t.filter(x=>x[1]).length;
  return '<div class="card"><h2>✅ '+p.name+' — Self-Test</h2><p class="muted">Checks this puzzle\'s data and engine. <b class="'+(pass===t.length?'ok':'fail')+'">'+pass+'/'+t.length+' passed</b> ('+total+' cases).</p>'+
    t.map(x=>'<div class="testrow"><span>'+x[0]+'</span><span class="'+(x[1]?'ok':'fail')+'">'+(x[1]?'PASS':'FAIL')+'</span></div>').join("")+
    '<p class="muted" style="font-size:12px;margin-top:10px">Algorithms are from SpeedCubeDB; the 3D engines were verified separately.</p></div>';
}
function wireRich(){
  document.querySelectorAll("[data-paint]").forEach(el=>el.onclick=()=>{const i=+el.dataset.paint;if(i===4)return;state.cubePaint[i]=!state.cubePaint[i];render();});
  document.querySelectorAll("[data-paintact]").forEach(b=>b.onclick=()=>{const a=b.dataset.paintact;state.cubePaint=a==='clear'?[false,false,false,false,true,false,false,false,false]:[true,true,true,true,true,true,true,true,true];render();});
  document.querySelectorAll("[data-ccolor]").forEach(inp=>inp.oninput=()=>{CUBE_COLORS[inp.dataset.ccolor]=inp.value;});
  document.querySelectorAll("[data-cact]").forEach(b=>b.onclick=()=>{if(b.dataset.cact==='save'){try{localStorage.setItem('amh_cubecolors',JSON.stringify(CUBE_COLORS));}catch(e){}toast('Cube colours saved 🎨');}else{Object.assign(CUBE_COLORS,defCubeColors());try{localStorage.removeItem('amh_cubecolors');}catch(e){}render();toast('Reset to default');}});
  document.querySelectorAll("[data-bhl]").forEach(b=>b.onclick=()=>{BASICS_HL=b.dataset.bhl;render();});
}
/* ===== Timer + stats (all puzzles) ===== */
let TIMER={running:false,t0:0,raf:0,scramble:""};
let TIMER_TIMES={};
function timerLoad(){try{TIMER_TIMES=JSON.parse(localStorage.getItem("amh_times")||"{}");}catch(e){TIMER_TIMES={};}}
function timerSave(){try{localStorage.setItem("amh_times",JSON.stringify(TIMER_TIMES));}catch(e){}}
function timerTimes(){const id=P().id;return TIMER_TIMES[id]||(TIMER_TIMES[id]=[]);}
function fmtT(ms){return (ms/1000).toFixed(2);}
function aoN(arr,n){if(arr.length<n)return null;const last=arr.slice(-n).slice().sort((a,b)=>a-b);const mid=last.slice(1,n-1);return mid.reduce((a,b)=>a+b,0)/mid.length;}
function genScramble(p){let faces,mods=["","'","2"],n=20;
  if(p.engine==='megaminx'){faces=["R","U","F","L","BR","DR"];}
  else if(p.engine==='pyra'){faces=["R","U","L","B"];mods=["","'"];n=8;}
  else if(p.engine==='cube'&&p.N===4){faces=["R","U","F","L","D","B","Rw","Uw","Fw"];n=36;}
  else {faces=["R","U","F","L","D","B"];}
  let s=[],prev="";for(let i=0;i<n;i++){let f;do{f=faces[Math.floor(Math.random()*faces.length)];}while(f[0]===prev[0]);prev=f;s.push(f+mods[Math.floor(Math.random()*mods.length)]);}
  if(p.engine==='pyra'){["u","l","r","b"].forEach(t=>{if(Math.random()<0.5)s.push(t+(Math.random()<0.5?"'":""));});}
  return s.join(" ");
}
function scrTimer(){const p=P();const arr=timerTimes();
  if(!TIMER.scramble)TIMER.scramble=genScramble(p);
  const best=arr.length?Math.min(...arr):null;
  const recent=arr.slice(-12).reverse();
  return '<div class="card"><h2>⏱️ '+p.name+' — Timer</h2>'+
    '<p class="muted">Scramble your real puzzle with the moves below, then tap the timer to start, and tap again to stop.</p>'+
    '<div class="alg" style="text-align:center;font-size:15px">'+TIMER.scramble+'</div>'+
    '<div class="row" style="justify-content:center;margin:6px 0"><button class="btn sm ghost" data-timer="scramble">↻ New scramble</button></div>'+
    '<div id="timerDisplay" data-timer="toggle" style="text-align:center;font-size:64px;font-weight:800;font-family:Consolas,monospace;cursor:pointer;padding:18px;border-radius:16px;background:#0c0f24;border:1px solid var(--line);user-select:none">'+fmtT(0)+'</div>'+
    '<div class="row" style="justify-content:center;gap:18px;margin-top:12px">'+
      '<div style="text-align:center"><div class="muted" style="font-size:12px">solves</div><b>'+arr.length+'</b></div>'+
      '<div style="text-align:center"><div class="muted" style="font-size:12px">best</div><b>'+(best!=null?fmtT(best):"—")+'</b></div>'+
      '<div style="text-align:center"><div class="muted" style="font-size:12px">ao5</div><b>'+(aoN(arr,5)!=null?fmtT(aoN(arr,5)):"—")+'</b></div>'+
      '<div style="text-align:center"><div class="muted" style="font-size:12px">ao12</div><b>'+(aoN(arr,12)!=null?fmtT(aoN(arr,12)):"—")+'</b></div>'+
    '</div>'+
    (recent.length?'<h3>Recent</h3><div class="movechips">'+recent.map(t=>'<span class="movechip">'+fmtT(t)+'</span>').join("")+'</div>':"")+
    (arr.length?'<div class="row" style="margin-top:10px"><button class="btn sm ghost" data-timer="clear">Clear times</button></div>':"")+
    '</div>';
}
function wireTimer(){
  const disp=document.getElementById("timerDisplay");
  if(disp) disp.onclick=()=>{
    if(!TIMER.running){TIMER.running=true;TIMER.t0=performance.now();
      const tick=()=>{if(!TIMER.running)return;disp.textContent=fmtT(performance.now()-TIMER.t0);TIMER.raf=requestAnimationFrame(tick);};tick();}
    else{TIMER.running=false;cancelAnimationFrame(TIMER.raf);const ms=performance.now()-TIMER.t0;timerTimes().push(ms);timerSave();TIMER.scramble=genScramble(P());render();toast("Nice! "+fmtT(ms)+"s ⏱️");}
  };
  document.querySelectorAll("[data-timer]").forEach(b=>{const a=b.dataset.timer;if(a==='toggle')return;
    b.onclick=()=>{if(a==='scramble'){TIMER.scramble=genScramble(P());render();}else if(a==='clear'){TIMER_TIMES[P().id]=[];timerSave();render();}};});
}
function findCase(kind,idx){const p=P();for(const g of p.cases){if(g.kind===kind)return g.list[idx];}return null;}
function openCaseTeach(kind,idx){
  if(ANIM_KINDS.includes(kind)&&cubeEngineOK(P())){ openCubeTeach(kind,idx); return; }
  const c=findCase(kind,idx); if(!c)return; const label=c.n!==undefined?(kind==='oll'?'OLL '+c.n:c.n):c.name; const moves=parseAlg(c.alg);
  state.screen="caseteach";
  document.getElementById("view").innerHTML='<div class="card"><div class="row between"><h2 style="margin:0">'+label+'</h2><span class="tag verified">verified</span></div>'+
    '<p class="muted">'+(P().note3d||"Algorithm and steps below.")+'</p>'+
    '<h3>The algorithm</h3><div class="alg">'+c.alg+'</div><div class="src" style="margin-top:6px">Source: SpeedCubeDB</div>'+
    '<h3>Steps</h3><div class="movechips">'+moves.map(m=>'<span class="movechip">'+m+'</span>').join("")+'</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn sm ghost" data-go="plibrary">← Back to cases</button></div></div>';
  renderTabs(); wire(); window.scrollTo({top:0,behavior:'smooth'});
}

/* restore saved colours */
try{const cs=JSON.parse(localStorage_safe_get("amh_colors")||"null");if(cs&&cs.c){COLORS=cs.c;if(cs.n)state.topColorName=cs.n;}}catch(e){}
try{const cc=JSON.parse(localStorage_safe_get("amh_cubecolors")||"null");if(cc)Object.assign(CUBE_COLORS,cc);}catch(e){}
/* precompute 3x3 OLL top-patterns for the Identify recognizer */
try{OLL3.forEach(o=>{o.sig=cubeOLLSig(o.alg);});}catch(e){}
try{timerLoad();}catch(e){}

/* PWA: register service worker for install + offline (no-op if unsupported/file://) */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

/* boot */
render();
